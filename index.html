    <script>
      // Aplica el esquema de color antes del primer render para evitar parpadeo (misma clave que Mantine).
      (function () {
        try {
          var stored = localStorage.getItem('shaddai-color-scheme');
          var scheme = stored === 'light' || stored === 'dark' ? stored : 'auto';
          var resolved =
            scheme === 'auto'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : scheme;
          document.documentElement.setAttribute('data-mantine-color-scheme', resolved);
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
